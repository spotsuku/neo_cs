// 変更ログモーダル
function showOnboLog(no){
  let logs = [];
  if(no){
    logs = LS.getArr('onbo_log_'+no);
  } else {
    // 全社のログを統合
    COMPANIES.forEach(c=>{
      const cl = LS.getArr('onbo_log_'+c.no);
      cl.forEach(l=>logs.push({...l, companyName: c.short, companyNo: c.no}));
    });
    logs.sort((a,b)=>b.ts.localeCompare(a.ts));
    logs = logs.slice(0, 100);
  }

  const c = no ? COMPANIES.find(x=>x.no===no) : null;
  const rows = logs.length > 0
    ? logs.map(l=>`
      <div style="padding:8px 0;border-bottom:1px solid var(--border);display:flex;align-items:flex-start;gap:10px">
        <div style="flex-shrink:0;width:100px;font-size:10px;color:var(--td);line-height:1.5">
          ${esc(l.ts||'')}
        </div>
        <div style="flex:1">
          <div style="font-size:11px;font-weight:700;color:var(--t1)">
            ${l.companyName?`<span style="color:var(--accent)">${esc(l.companyName)}</span> / `:''}${esc(l.taskLabel||l.taskId)}
          </div>
          <div style="font-size:11px;color:var(--td);margin-top:2px;display:flex;align-items:center;gap:6px">
            <span style="color:${(ONBO_CHECK_STATES[l.from]||ONBO_CHECK_STATES[0]).color}">${esc(l.fromLabel||'—')}</span>
            →
            <span style="font-weight:700;color:${(ONBO_CHECK_STATES[l.to]||ONBO_CHECK_STATES[0]).color}">${esc(l.toLabel||'—')}</span>
            <span style="color:var(--accent)">👤 ${esc(l.user||'—')}</span>
          </div>
        </div>
      </div>`).join('')
    : '<div style="padding:40px;text-align:center;color:var(--td)">変更ログはありません</div>';

  showModal(`
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
      <div>
        <div style="font-size:16px;font-weight:700">📋 変更ログ</div>
        <div style="font-size:11px;color:var(--td);margin-top:2px">${c?esc(c.short)+'の変更履歴':'全社の変更履歴（直近100件）'}</div>
      </div>
      <button onclick="closeModal()" style="border:none;background:none;cursor:pointer;font-size:20px;color:var(--td)">✕</button>
    </div>
    <div style="max-height:60vh;overflow-y:auto">${rows}</div>
  `, '560px');
}

function renderOnboardingAll(){
  const page = document.getElementById('page-onboarding-all');
  if(!page) return;

  const filterPhase  = window._onboFilterPhase  || 'p1';
  const filterStatus = window._onboFilterStatus || 'all';
  const filterCo     = window._onboFilterCo     || '';

  // ── KPI集計 ──
  let totalTasks=0, totalDone=0;
  const companyStats = COMPANIES.map(c=>{
    const done = LS.get('onbo_'+c.no);
    let cTotal=0, cDone=0;
    ONBO_PHASES.forEach(p=>{
      const tasks = getGlobalTasks(p.id);
      cTotal += tasks.length;
      tasks.forEach(t=>{ if(done[t.id]) cDone++; });
    });
    totalTasks += cTotal;
    totalDone  += cDone;
    return {c, cTotal, cDone, pct: cTotal>0 ? Math.round(cDone/cTotal*100) : 0};
  });

  const completed  = companyStats.filter(s=>s.pct===100).length;
  const inProgress = companyStats.filter(s=>s.pct>0&&s.pct<100).length;
  const notStarted = companyStats.filter(s=>s.pct===0).length;
  const pctAll     = totalTasks>0 ? Math.round(totalDone/totalTasks*100) : 0;

  // ── フィルタリング ──
  let filtered = [...companyStats];
  if(filterStatus==='done')     filtered = filtered.filter(s=>s.pct===100);
  if(filterStatus==='progress') filtered = filtered.filter(s=>s.pct>0&&s.pct<100);
  if(filterStatus==='none')     filtered = filtered.filter(s=>s.pct===0);
  if(filterCo) filtered = filtered.filter(s=>
    s.c.short.includes(filterCo)||s.c.name.includes(filterCo));

  const phase = ONBO_PHASES.find(p=>p.id===filterPhase) || ONBO_PHASES[0];

  // ── フェーズタブ ──
  const phaseTabs = ONBO_PHASES.map(p=>{
    const active = filterPhase===p.id;
    const pDoneCount = filtered.filter(({c})=>{
      const tasks = getGlobalTasks(p.id);
      const done  = LS.get('onbo_'+c.no);
      return tasks.length>0 && tasks.every(t=>done[t.id]);
    }).length;
    return `<button onclick="window._onboFilterPhase='${p.id}';renderOnboardingAll()"
      style="padding:8px 16px;font-size:12px;font-weight:${active?'700':'500'};
        border-radius:8px 8px 0 0;border:1px solid ${active?p.color:'var(--border)'};
        border-bottom:${active?'2px solid '+p.color:'1px solid var(--border)'};
        background:${active?p.color+'18':'var(--surface2)'};
        color:${active?p.color:'var(--td)'};cursor:pointer;white-space:nowrap;margin-bottom:-1px">
      ${esc(getPhaseName(p.id))}
      <span style="font-size:10px;margin-left:6px;opacity:.7">${pDoneCount}/${filtered.length}</span>
    </button>`;
  }).join('');

  // ── 共通期日の取得（フェーズ×タスク単位でLS管理）──
  const phaseDueKey = 'onbo_phase_due';
  const phaseDues = LS.get(phaseDueKey);  // {phaseId_taskId: 'YYYY-MM-DD'}

  // タスクリスト
  // マスターデータから直接取得（特定企業への依存なし）
  const allTasks = getGlobalTasks(phase.id);

  // ── 期日の色・表示テキスト ──
  function getDueDisplay(dueStr){
    if(!dueStr) return {color:'var(--td)', text:'', icon:'', bg:'transparent'};
    const diff = Math.ceil((new Date(dueStr)-new Date().setHours(0,0,0,0))/86400000);
    if(diff < 0)      return {color:'var(--ng)',   text:dueStr.slice(5), icon:'⚠', bg:'#fee2e2'};
    if(diff <= 3)     return {color:'var(--warn)',  text:dueStr.slice(5), icon:'⏰', bg:'#fef3c7'};
    if(diff <= 7)     return {color:'#059669',      text:dueStr.slice(5), icon:'',  bg:'#d1fae5'};
    return              {color:'var(--td)',          text:dueStr.slice(5), icon:'',  bg:'var(--surface2)'};
  }

  // ── タスクヘッダー ──
  const thCells = allTasks.map(t=>{
    const dueVal = phaseDues[phase.id+'::'+t.id] || '';
    const {color, text, icon, bg} = getDueDisplay(dueVal);
    return `<th style="padding:0;font-weight:700;
      border-right:1px solid var(--border);
      min-width:108px;max-width:130px;vertical-align:bottom;text-align:center">
      <!-- タスク名 -->
      <div style="padding:8px 8px 6px;font-size:11px;font-weight:700;
        color:#fff;background:${phase.color};
        line-height:1.5;min-height:44px;
        display:flex;align-items:center;justify-content:center;
        word-break:break-all;text-align:center;letter-spacing:.3px">
        ${esc(t.label)}
      </div>
      <!-- 共通期日入力 -->
      <div style="padding:5px 6px;background:${bg};border-top:1px solid ${dueVal?color+'44':'var(--border)'}">
        <input type="date" value="${esc(dueVal)}"
          title="共通期日（全社共通）"
          onchange="saveOnboPhaseTaskDue('${esc(phase.id)}','${esc(t.id)}',this.value);renderOnboardingAll()"
          style="width:100%;padding:3px 5px;border:1px solid ${dueVal?color:'var(--border)'};
            border-radius:4px;font-size:10px;color:${dueVal?color:'var(--td)'};
            background:transparent;outline:none;cursor:pointer;font-family:'Space Mono',monospace;
            font-weight:${dueVal?'700':'400'}"
          onfocus="this.style.borderColor='var(--accent)'"
          onblur="this.style.borderColor='${dueVal?color:'var(--border)'}'">
        ${dueVal&&icon?`<div style="font-size:9px;color:${color};font-weight:700;margin-top:2px;text-align:center">${icon} ${getDueDisplay(dueVal).text}</div>`:''}
      </div>
    </th>`;
  }).join('');

  // ── テーブル行 ──
  const tableRows = filtered.map(({c})=>{
    const done  = LS.get('onbo_'+c.no);
    const tasks = getGlobalTasks(phase.id);
    const pDone = tasks.filter(t=>done[t.id]).length;
    const pct   = tasks.length>0 ? Math.round(pDone/tasks.length*100) : 0;

    const cells = tasks.map(t=>{
      const isDone  = getCheckState(done[t.id]).val === 2;  // 三段階: 2=完了
      // 共通期日を使用（個別期日があれば個別優先）
      const meta    = LS.get('onbo_meta_'+c.no);
      const indivDue = meta&&meta[t.id]&&meta[t.id].due ? meta[t.id].due : null;
      const commonDue = phaseDues[phase.id+'::'+t.id] || null;
      const due     = indivDue || commonDue || '';
      const owner   = (meta&&meta[t.id]&&meta[t.id].owner) ? meta[t.id].owner : '';

      let cellBg = 'transparent';
      let dueNode = '';
      if(due && !isDone){
        const {color, text, icon, bg} = getDueDisplay(due);
        cellBg = bg;
        if(icon) dueNode = `<div style="font-size:9px;color:${color};font-weight:700">${icon}</div>`;
      }

      // 期日の色情報（背景に使う）
      const dueBorderColor = due&&!isDone ? getDueDisplay(due).color : 'var(--border)';
      const dueIconText    = due&&!isDone ? getDueDisplay(due).icon  : '';
      const dueDateText    = due&&!isDone ? getDueDisplay(due).text  : '';

      return `<td style="padding:5px 4px;text-align:center;
        border-right:1px solid var(--border);vertical-align:middle;
        background:${(()=>{ const st=getCheckState(done[t.id]); return st.val===2?'#d1fae5':st.val===1?'#fffbeb':cellBg==='transparent'?'#f8fafc':cellBg; })()}"
        oncontextmenu="showOnboCellMenu(event,${c.no},'${esc(t.id)}','${esc(t.label)}');return false">
        <div onclick="cycleOnboCheck(${c.no},'${esc(t.id)}','${esc(t.label)}')"
          title="クリックで状態を切り替え"
          style="cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px">
          ${(()=>{
            const st = getCheckState(done[t.id]);
            return `<div style="width:26px;height:26px;border-radius:6px;
              border:2px solid ${st.color};
              background:${st.bg};
              display:flex;align-items:center;justify-content:center;
              font-size:14px;color:${st.color};font-weight:900;
              box-shadow:0 1px 4px rgba(0,0,0,.15)"
              title="${st.label}">${st.icon}</div>
            <div style="font-size:8px;color:${st.color};font-weight:700;white-space:nowrap">${st.label}</div>`;
          })()}
          ${owner?`<div style="font-size:8px;color:var(--accent);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:1px">👤${esc(owner)}</div>`:''}
          ${dueIconText?`<div style="font-size:10px;font-weight:700;color:${dueBorderColor}">${dueIconText}</div>`:''}
          ${(()=>{
            const meta2 = LS.get('onbo_meta_'+c.no);
            return meta2[t.id]?.comment ? `<div style="font-size:9px;color:var(--accent)">💬</div>` : '';
          })()}
        </div>
      </td>`;
    }).join('');

    const nameLen = c.short.length;
    const nameFontSize = nameLen > 8 ? '10px' : nameLen > 5 ? '11px' : '12px';

    return `<tr style="border-bottom:1px solid var(--border)"
      onmouseover="this.style.background='var(--surface2)'"
      onmouseout="this.style.background=''">
      <td style="padding:6px 10px;border-right:2px solid var(--border);
        position:sticky;left:0;background:var(--surface);z-index:1;
        width:1%;white-space:nowrap">
        <button onclick="selectCompany(${c.no});switchMainTab('onboarding')"
          style="background:none;border:none;cursor:pointer;text-align:left;padding:0">
          <div style="font-size:${nameFontSize};font-weight:700;color:var(--accent)">${esc(c.short)}</div>
          <div style="display:flex;align-items:center;gap:5px;margin-top:2px">
            <span style="font-size:9px;color:var(--td)">${pDone}/${tasks.length}</span>
            <div style="width:36px;height:3px;background:var(--surface3);border-radius:2px;overflow:hidden">
              <div style="width:${pct}%;height:100%;background:${pct===100?'var(--ok)':'var(--accent)'};border-radius:2px"></div>
            </div>
          </div>
        </button>
      </td>
      ${cells}
    </tr>`;
  }).join('');

  page.innerHTML = `
    <!-- 管理ツールバー -->
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 14px;
      background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:12px">
      <button onclick="showPhaseNameEditor()"
        style="padding:5px 14px;font-size:11px;border:1px solid var(--accent);border-radius:6px;
          background:var(--accent-lt);color:var(--accent);cursor:pointer;font-weight:700">
        ✏ フェーズ名編集
      </button>
      <button onclick="showOnboLog(null)"
        style="padding:5px 14px;font-size:11px;border:1px solid var(--border);border-radius:6px;
          background:var(--surface2);color:var(--t2);cursor:pointer">
        📋 変更ログ
      </button>
    </div>

    <div style="margin-bottom:16px">
      <div style="font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px">📊 オンボーディング一覧</div>
      <div style="font-size:13px;color:var(--td);margin-top:4px">
        フェーズ別タスクの進捗を全企業横断で確認・チェックできます
        <span style="margin-left:12px;font-size:11px;color:var(--td)">💡 ヘッダーの日付欄に共通期日を設定できます</span>
      </div>
    </div>

    <!-- KPIカード -->
    <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">
      ${[
        {label:'全体進捗', val:pctAll+'%',      color:'var(--accent)', sub:totalDone+'/'+totalTasks+'タスク'},
        {label:'✅ 完了',  val:completed+'社',  color:'var(--ok)',     sub:'全タスク完了'},
        {label:'🔄 進行中',val:inProgress+'社', color:'#1a56db',       sub:'一部完了'},
        {label:'⬜ 未着手',val:notStarted+'社', color:'var(--td)',     sub:'チェックなし'},
      ].map(k=>`<div style="flex:1;min-width:100px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:32px;line-height:1;color:${k.color}">${k.val}</div>
        <div style="font-size:11px;font-weight:700;color:var(--t1);margin-top:3px">${k.label}</div>
        <div style="font-size:10px;color:var(--td);margin-top:1px">${k.sub}</div>
      </div>`).join('')}
    </div>

    <!-- フィルターバー -->
    <div style="background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:0">
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span style="font-size:10px;font-weight:700;color:var(--td);flex-shrink:0">進捗</span>
        ${[
          {id:'all',label:'すべて',color:'#64748b'},
          {id:'done',label:'✅ 完了',color:'var(--ok)'},
          {id:'progress',label:'🔄 進行中',color:'#1a56db'},
          {id:'none',label:'⬜ 未着手',color:'var(--td)'},
        ].map(f=>`<button onclick="window._onboFilterStatus='${f.id}';renderOnboardingAll()"
          style="padding:4px 10px;font-size:11px;border-radius:5px;
            border:1px solid ${filterStatus===f.id?f.color:'var(--border)'};
            background:${filterStatus===f.id?f.color+'22':'var(--surface2)'};
            color:${filterStatus===f.id?f.color:'var(--td)'};cursor:pointer">${f.label}</button>`).join('')}
        <input type="text" value="${esc(filterCo)}" placeholder="🔍 企業名で絞込..."
          oninput="window._onboFilterCo=this.value;renderOnboardingAll()"
          style="margin-left:auto;width:160px;padding:5px 10px;
            border:1px solid var(--border);border-radius:6px;
            font-size:12px;background:var(--surface2);color:var(--t1);outline:none"
          onfocus="this.style.borderColor='var(--accent)'"
          onblur="this.style.borderColor='var(--border)'">
      </div>
    </div>

    <!-- フェーズタブ -->
    <div style="display:flex;gap:4px;overflow-x:auto;padding-top:16px;
      border-bottom:1px solid var(--border);margin-bottom:16px">
      ${phaseTabs}
    </div>

    <div id="task-mgmt-panel-${phase.id}"></div>

    <!-- テーブル -->
    <div id="onbo-table-wrap" style="overflow:auto;border:1px solid var(--border);border-radius:10px;max-height:calc(100vh - 320px)">

function buildTaskMgmtPanel(phaseId){
  const el = document.getElementById('task-mgmt-panel-'+phaseId);
  if(!el) return;
  el.innerHTML = '';

  const tasks = getGlobalTasks(phaseId);

  const wrap = document.createElement('div');
  wrap.style.cssText = 'background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:14px';

  const inner = document.createElement('div');
  inner.style.cssText = 'display:flex;align-items:center;gap:10px;flex-wrap:wrap';

  const lbl = document.createElement('span');
  lbl.style.cssText = 'font-size:11px;font-weight:700;color:var(--t2);flex-shrink:0';
  lbl.textContent = '📝 タスク管理（全社共通）';
  inner.appendChild(lbl);

  const chipsWrap = document.createElement('div');
  chipsWrap.style.cssText = 'display:flex;gap:6px;flex:1;flex-wrap:wrap';

  tasks.forEach((t, i)=>{
    const chip = document.createElement('div');
    chip.style.cssText = 'display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;font-size:11px;color:var(--t2)';

    const labelSpan = document.createElement('span');
    labelSpan.id = 'gtask-label-'+phaseId+'-'+i;
    labelSpan.textContent = t.label;
    chip.appendChild(labelSpan);

    const renameBtn = document.createElement('button');
    renameBtn.textContent = '✏';
    renameBtn.title = '名前変更';
    renameBtn.style.cssText = 'border:none;background:none;cursor:pointer;color:var(--td);padding:0 2px;font-size:11px';
    renameBtn.onclick = (()=>{ const tid=t.id,lbl=t.label,idx=i; return ()=>startGlobalRenameFromList(phaseId,idx,tid,lbl); })();
    chip.appendChild(renameBtn);

    const delBtn = document.createElement('button');
    delBtn.textContent = '✕';
    delBtn.title = '削除';
    delBtn.style.cssText = 'border:none;background:none;cursor:pointer;color:var(--td);padding:0 2px;font-size:11px';
    delBtn.onmouseover = ()=>{ delBtn.style.color='var(--ng)'; };
    delBtn.onmouseout  = ()=>{ delBtn.style.color='var(--td)'; };
    delBtn.onclick = (()=>{
      const tid = t.id;
      const pid = phaseId;
      return ()=>{
        if(confirm('削除しますか？全社のチェックも削除されます。')){
          deleteGlobalTask(pid, tid);
          renderOnboardingAll();
          toast('🗑 タスクを削除しました（全社共通）');
        }
      };
    })();
    chip.appendChild(delBtn);
    chipsWrap.appendChild(chip);
  });
  inner.appendChild(chipsWrap);

  const formWrap = document.createElement('div');
  formWrap.style.cssText = 'display:flex;gap:6px;flex-shrink:0';

  const input = document.createElement('input');
  input.type = 'text';
  input.placeholder = '+ タスクを追加...';
  input.id = 'new-global-task-'+phaseId;
  input.style.cssText = 'padding:5px 10px;border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--t1);background:var(--surface2);outline:none;width:180px';
  input.addEventListener('focus', ()=>{ input.style.borderColor='var(--accent)'; });
  input.addEventListener('blur',  ()=>{ input.style.borderColor='var(--border)'; });
  input.onkeydown = e=>{
    if(e.key==='Enter'){
      const val = input.value.trim();
      if(!val) return;
      addGlobalTask(phaseId, val);
      input.value = '';
      renderOnboardingAll();
      toast('✅ タスクを追加しました（全社共通）');
    }
  };
  formWrap.appendChild(input);

  const addBtn = document.createElement('button');
  addBtn.textContent = '＋ 追加';
  addBtn.style.cssText = 'padding:5px 14px;background:var(--accent);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0';
  addBtn.onclick = ()=>{
    const val = input.value.trim();
    if(!val) return;
    addGlobalTask(phaseId, val);
    input.value = '';
    renderOnboardingAll();
    toast('✅ タスクを追加しました（全社共通）');
  };
  formWrap.appendChild(addBtn);
  inner.appendChild(formWrap);

  wrap.appendChild(inner);
  el.appendChild(wrap);
}

// フェーズ×タスクの共通期日を保存
function saveOnboPhaseTaskDue(phaseId, taskId, dueVal){
  const d = LS.get('onbo_phase_due');
  d[phaseId+'::'+taskId] = dueVal;
  localStorage.setItem('neo_ps_onbo_phase_due', JSON.stringify(d));
  // Supabaseに即時保存（awaitしないが確実に送信）
  LSdb._call({key:'onbo_phase_due', value:d}).then(()=>{
    console.log('[LSdb] onbo_phase_due saved');
  }).catch(e=>console.warn('[LSdb] save error:', e.message));
}

function toggleOnboByIdAndRefresh(no, taskId){
  const done = LS.get('onbo_'+no);
  done[taskId] = !done[taskId];
  // LocalStorage即時更新
  localStorage.setItem('neo_ps_onbo_'+no, JSON.stringify(done));
  // Supabase即時保存
  LSdb._call({key:'onbo_'+no, value:done})
    .catch(e=>console.warn('[LSdb] save error:', e.message));
  renderOnboardingAll();
  toast(done[taskId]?'✅ 完了':'↩ 未完了に戻しました');
}

function renderMilestonePage(){
  const page = document.getElementById('page-milestone');
  const defs = MILESTONE_DATA.defs;
  const byNo = MILESTONE_DATA.by_no;

  // ── KPI集計 ──
  let totalItems=0, doneItems=0, wipItems=0, pendingItems=0, skipItems=0;
  COMPANIES.forEach(c=>{
    const ms = getMsForCompany(c.no);
    if(!ms.length) return;
    ms.forEach(m=>{
      totalItems++;
      if(m.status==='done') doneItems++;
      else if(m.status==='wip'||m.status==='ready') wipItems++;
      else if(m.status==='skip') skipItems++;
      else pendingItems++;
    });
  });
  const pct = totalItems>0 ? Math.round(doneItems/totalItems*100) : 0;

  const typeColors = {meeting:'#3b82f6', notice:'#f59e0b', action:'#059669', contract:'#7c3aed'};
  const typeLabels = {meeting:'評議会・MTG', notice:'連絡・通知', action:'アクション', contract:'契約'};

  // ── フィルター ──
  const filterVal = window._msFilter || '';
  const typeFilter = window._msTypeFilter || '';

  let rows = COMPANIES.filter(c=>byNo[String(c.no)]);
  if(filterVal==='cont')  rows=rows.filter(c=>!['D：非継続'].includes(getContract(c.no)));
  if(filterVal==='new')   rows=rows.filter(c=>c.status==='新規契約');
  if(filterVal==='disc')  rows=rows.filter(c=>getContract(c.no)==='D：非継続');

  const filteredDefs = typeFilter ? defs.filter(d=>d.type===typeFilter) : defs;

  // ── テーブルHTML ──
  const theadCols = filteredDefs.map(d=>{
    // 全社で最もよく使われているオーバーライドラベルを取得
    const overriddenLabels = COMPANIES.map(c=>{
      const ov = getMsOverrides(c.no);
      return ov[d.id]?.label;
    }).filter(Boolean);
    const displayLabel = overriddenLabels.length > 0 ? overriddenLabels[0] : d.label;
    return `<th class="ms-type-${d.type}" title="${typeLabels[d.type]}">${esc(d.date)}<br><span style="font-size:9px">${esc(displayLabel)}</span></th>`;
  }).join('');
  
  const tbody = rows.map(c=>{
    const d = byNo[String(c.no)];
    const contract = getContract(c.no);
    // journey は使わずステージ番号と契約状況を表示
    const stage    = getStage(c.no);
    const stageLabel = `St.${stage}`;
    const stageColor = stage>=11?'var(--ok)':stage>=9?'var(--accent)':stage>=7?'var(--warn)':'var(--td)';
    const msDone = d ? d.milestones.filter(m=>m.status==='done').length : 0;
    const msTotal = d ? d.milestones.length : 0;
    const pctCo = msTotal>0 ? Math.round(msDone/msTotal*100) : 0;
    const [tagCls,tagLabel] = contractInfo(contract);
    
    const msCols = filteredDefs.map(md=>{
      const mEntry = d?.milestones.find(m=>m.id===md.id);
      if(!mEntry) return '<td></td>';
      const cur = getMsStatus(c.no, md.id);
      const selOpts = MS_STATUS_OPTIONS.map(o=>`<option value="${o.value}" ${cur.status===o.value?'selected':''}>${o.label}</option>`).join('');
      const pipLabel = cur.raw==='未調整'||cur.raw==='未着手'?'—':esc(cur.raw);
      const editedLabel = cur.label || md.label;
      return `<td style="text-align:center;padding:4px 6px">
        <div style="display:flex;flex-direction:column;align-items:center;gap:3px">
          <span class="ms-pip ${cur.status}" style="width:100%;font-size:9px" title="${esc(editedLabel)}">${pipLabel}</span>
          <select onchange="changeMsStatus(${c.no},'${md.id}',this)" style="font-size:8px;padding:1px 2px;border:1px solid var(--border);border-radius:3px;background:var(--surface2);width:100%;cursor:pointer;color:var(--td)">
            ${selOpts}
          </select>
        </div>
      </td>`;
    }).join('');

    return `<tr>
      <td class="co-td" onclick="goToCompany(${c.no})" style="min-width:130px">
        <div style="font-size:11px;font-weight:700">${esc(c.short)}</div>
        <div style="display:flex;align-items:center;gap:5px;margin-top:3px">
          <span class="cs-tag ${tagCls}" style="font-size:8px">${tagLabel}</span>
          <span style="font-size:9px;color:${stageColor};font-family:'Space Mono',monospace">${stageLabel}</span>
        </div>
        <div style="margin-top:4px;height:4px;background:var(--surface3);border-radius:2px;overflow:hidden">
          <div style="width:${pctCo}%;height:100%;background:${pctCo===100?'var(--ok)':pctCo>=50?'var(--accent)':'var(--warn)'}"></div>
        </div>
        <div style="font-size:8px;color:var(--td);margin-top:2px">${msDone}/${msTotal} 完了</div>
      </td>
      ${msCols}
    </tr>`;
  }).join('');

  page.innerHTML = `
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px">
    <div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:36px;letter-spacing:2px">🗓 CSマイルストーン管理</div>
      <div style="font-size:13px;color:var(--td);margin-top:2px">全社のタッチポイント・連絡・MTGの実施状況を一覧管理</div>
    </div>
    <div style="font-family:'Bebas Neue',sans-serif;font-size:48px;color:${pct>=80?'var(--ok)':pct>=50?'var(--accent)':'var(--warn)'}">
      ${pct}<span style="font-size:20px;color:var(--td)">%</span>
    </div>
  </div>

  <!-- KPI -->
  <div class="ms-kpi-row">
    <div class="ms-kpi"><div class="ms-kpi-val" style="color:var(--ok)">${doneItems}</div><div class="ms-kpi-label">完了</div></div>
    <div class="ms-kpi"><div class="ms-kpi-val" style="color:var(--accent)">${wipItems}</div><div class="ms-kpi-label">進行中・準備完了</div></div>
    <div class="ms-kpi"><div class="ms-kpi-val" style="color:var(--warn)">${pendingItems}</div><div class="ms-kpi-label">未着手</div></div>
    <div class="ms-kpi"><div class="ms-kpi-val" style="color:var(--td)">${skipItems}</div><div class="ms-kpi-label">非対象</div></div>
    <div class="ms-kpi"><div class="ms-kpi-val" style="color:var(--t1)">${totalItems}</div><div class="ms-kpi-label">総タスク数</div></div>
  </div>

  <!-- フィルター & 凡例 -->
  <div class="ms-filter-row">
    <span style="font-size:11px;color:var(--td);font-weight:700">企業：</span>
    ${[['','全社'],['cont','継続'],['new','新規'],['disc','非継続']].map(([v,l])=>`<button class="sb-filter-btn ${(window._msFilter||'')==v?'active':''}" onclick="window._msFilter='${v}';renderMilestonePage()">${l}</button>`).join('')}
    <span style="font-size:11px;color:var(--td);font-weight:700;margin-left:12px">種別：</span>
    ${[['','すべて'],['meeting','評議会・MTG'],['notice','連絡・通知'],['action','アクション'],['contract','契約']].map(([v,l])=>`<button class="sb-filter-btn ${(window._msTypeFilter||'')==v?'active':''}" onclick="window._msTypeFilter='${v}';renderMilestonePage()">${l}</button>`).join('')}
  </div>
  <div class="ms-legend">
    <span style="font-size:10px;font-weight:700;color:var(--td)">凡例：</span>
    <div class="ms-legend-item"><div class="ms-dot" style="background:var(--ok)"></div><span style="color:var(--ok)">実施完了</span></div>
    <div class="ms-legend-item"><div class="ms-dot" style="background:#3b82f6"></div><span style="color:#3b82f6">準備完了・進行中</span></div>
    <div class="ms-legend-item"><div class="ms-dot" style="background:var(--warn)"></div><span style="color:var(--warn)">調整中</span></div>

    <div style="margin-left:auto;display:flex;gap:8px">
      ${Object.entries(typeColors).map(([t,col])=>`<div class="ms-legend-item"><div style="width:14px;height:3px;background:${col};border-radius:2px"></div><span style="color:${col}">${typeLabels[t]}</span></div>`).join('')}
    </div>
  </div>

  <!-- テーブル -->
  <div class="ms-table-wrap">
    <table class="ms-table">
      <thead><tr>
        <th class="co-th">企業 / 進捗</th>
        ${theadCols}
      </tr></thead>
      <tbody>${tbody}</tbody>
    </table>
  </div>`;
}

function renderBoard(){
  const boardEl=document.getElementById('page-board');
  const header=`<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px"><div><div style="font-family:'Bebas Neue';font-size:36px;letter-spacing:2px">📌 企業進捗 ボードビュー</div><div style="font-size:13px;color:var(--td);margin-top:2px">ドラッグ&ドロップでステージを移動できます</div></div><div style="display:flex;gap:10px;align-items:center"><select id="board-filter-status" class="meeting-date-input" style="width:140px" onchange="renderBoard()"><option value="">すべて</option><option value="既存顧客">既存顧客</option><option value="新規契約">新規契約</option></select><select id="board-filter-contract" class="meeting-date-input" style="width:160px" onchange="renderBoard()"><option value="">契約：すべて</option>${['S：契約書締結','A：契約中','B：内諾確認済','C：社内調整中','D：非継続'].map(v=>`<option value="${v}">${v}</option>`).join('')}</select></div></div>`;
  const statusF=document.getElementById('board-filter-status')?.value||'';
  const contractF=document.getElementById('board-filter-contract')?.value||'';
  const filteredCos=COMPANIES.filter(c=>{const contract=getContract(c.no);if(statusF&&c.status!==statusF)return false;if(contractF&&contract!==contractF)return false;return true;});
  const cols=STAGES.map(stage=>{const companies=filteredCos.filter(c=>getStage(c.no)===stage.no);const cards=companies.map(c=>{const contract=getContract(c.no);const[cls,label]=contractInfo(contract);return`<div class="board-card" draggable="true" ondragstart="boardDragStart(event,${c.no})" ondragend="boardDragEnd(event)" onclick="goToCompany(${c.no})"><div class="board-card-name">${esc(c.short)}</div><div class="board-card-meta"><span class="board-card-contract ${cls}">${label}</span>${c.cs?`<span class="board-card-cs">${esc(c.cs.split(' ')[0])}</span>`:''}</div><div class="board-month" style="margin-top:4px">${c.status==='新規契約'?'🆕 新規':esc(c.course2||c.course1||'—')}</div></div>`;}).join('')||`<div class="board-empty">企業なし</div>`;return`<div class="board-col" ondragover="boardDragOver(event)" ondragleave="boardDragLeave(event)" ondrop="boardDrop(event,${stage.no})"><div class="board-col-header" style="border-color:${stage.color}"><div class="board-col-num" style="color:${stage.color}">${stage.no}</div><div class="board-col-title">${esc(stage.name)}<br><span style="font-family:'Space Mono';font-size:9px;color:var(--t-muted)">${stage.month}</span></div><span class="board-col-count" style="background:${stage.color}22;color:${stage.color}">${companies.length}</span></div>${cards}</div>`;}).join('');
  boardEl.innerHTML=header+`<div class="board-wrap">${cols}</div>`;
}
let draggedCompanyNo=null;
function boardDragStart(e,no){draggedCompanyNo=no;e.target.classList.add('dragging');e.dataTransfer.effectAllowed='move';}
function boardDragEnd(e){e.target.classList.remove('dragging');}
function boardDragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');}
function boardDragLeave(e){e.currentTarget.classList.remove('drag-over');}
function boardDrop(e,stageNo){e.preventDefault();e.currentTarget.classList.remove('drag-over');if(draggedCompanyNo!==null){setStage(draggedCompanyNo,stageNo);const c=COMPANIES.find(x=>x.no===draggedCompanyNo);toast(`${c?.short||''} → St.${stageNo} ${STAGES[stageNo-1]?.name||''}`);draggedCompanyNo=null;renderBoard();}}

  </div>
  <span style="font-family:'Space Mono';font-size:10px;color:var(--td)">NEO ACADEMIA 2期</span>
</div></div><div class="ov-kpi-row"><div class="ov-kpi"><div class="ov-kpi-label">総パートナー数</div><div class="ov-kpi-val" style="color:var(--accent)">${COMPANIES.length}</div><div class="ov-kpi-sub">社</div></div><div class="ov-kpi"><div class="ov-kpi-label">契約中（S+A）</div><div class="ov-kpi-val" style="color:var(--ok)">${s_count+a_count}</div><div class="ov-kpi-sub">社</div></div><div class="ov-kpi"><div class="ov-kpi-label">新規契約</div><div class="ov-kpi-val" style="color:var(--purple)">${newCo.length}</div><div class="ov-kpi-sub">社</div></div><div class="ov-kpi"><div class="ov-kpi-label">非継続</div><div class="ov-kpi-val" style="color:var(--ng)">${disc.length}</div><div class="ov-kpi-sub">社</div></div><div class="ov-kpi"><div class="ov-kpi-label">企業平均満足度</div><div class="ov-kpi-val" style="color:${scColor(avg_sat)}">${avg_sat}</div><div class="ov-kpi-sub">/10</div></div><div class="ov-kpi"><div class="ov-kpi-label">年間売上（継続）</div><div class="ov-kpi-val" style="color:var(--ok);font-size:28px">¥${(total_rev/1000000).toFixed(0)}M</div><div class="ov-kpi-sub">継続企業合計</div></div></div><div class="section-header"><div class="section-num">1</div><div class="section-title">顧客健全マトリクス</div><div style="margin-left:auto;display:flex;gap:8px;font-size:10px;align-items:center"><span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:var(--ok);display:inline-block"></span>健全</span><span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:var(--warn);display:inline-block"></span>要注意</span><span style="display:flex;align-items:center;gap:4px"><span style="width:10px;height:10px;border-radius:50%;background:var(--ng);display:inline-block"></span>リスク</span></div></div><div class="health-matrix"><table class="hm-table"><thead><tr><th>企業名</th><th>契約状況</th><th>ステータス</th><th>CS担当</th><th>コース</th><th>卒業率</th><th>企業満足</th><th>企業成長</th><th>健全スコア</th><th>面談数</th><th>操作</th></tr></thead><tbody>${COMPANIES.filter(c=>{
  const contract=getContract(c.no);
  if(ovFilter==='disc') return contract==='D：非継続';
  if(ovFilter==='active') return contract!=='D：非継続';
  return true; // all
}).map(c=>{const contract=getContract(c.no);const[cls,label]=contractInfo(contract);const health=getHealthScore(c);const hColor=health>=7?'var(--ok)':health>=5?'var(--warn)':'var(--ng)';const gradRate=c.sent>0?Math.round(c.grad/c.sent*100)+'%':'—';const meetings=LS.getArr('meetings_'+c.no).length;return`<tr class="${c.status==='新規契約'?'is-new':''}"><td><span class="co-name-cell" onclick="goToCompany(${c.no})">${esc(c.short)}</span></td><td><span class="cs-tag ${cls}">${label}</span></td><td style="font-size:11px;color:var(--td)">${esc(c.status)}</td><td style="font-size:11px">${esc(c.cs)||'—'}</td><td style="font-size:11px">${esc(c.course2||c.course1||'—')}</td><td style="font-weight:700;font-size:13px">${gradRate}</td><td><span class="score-pill" style="color:${scColor(c.ent_sat)}">${c.ent_sat!=null?c.ent_sat:'—'}</span></td><td><span class="score-pill" style="color:${scColor(c.ent_grow)}">${c.ent_grow!=null?c.ent_grow:'—'}</span></td><td><div class="health-bar-wrap"><div class="health-bar"><div class="health-bar-fill" style="width:${health*10}%;background:${hColor}"></div></div><span style="font-family:'Bebas Neue';font-size:16px;color:${hColor}">${health}</span></div></td><td style="font-size:12px;font-weight:700;color:${meetings>=3?'var(--ok)':meetings>=1?'var(--warn)':'var(--td)'}">${meetings}</td><td><button onclick="goToCompany(${c.no})" style="font-size:10px;padding:3px 10px;border-radius:5px;border:1px solid var(--border);background:var(--surface2);cursor:pointer" onmouseover="this.style.background='var(--accent-lt)';this.style.color='var(--accent)'" onmouseout="this.style.background='var(--surface2)';this.style.color=''">詳細 →</button></td></tr>`;}).join('')}</tbody></table></div><div class="section-header"><div class="section-num">2</div><div class="section-title">契約ステータス分布</div></div><div class="grid3"><div class="panel"><div class="panel-title">契約状況</div>${['S：契約書締結','A：契約中','B：内諾確認済','C：社内調整中','D：非継続'].map(ct=>{const count=COMPANIES.filter(c=>getContract(c.no)===ct).length;const[cls,label]=contractInfo(ct);return`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)"><span class="cs-tag ${cls}">${label}</span><div style="flex:1;height:6px;background:var(--surface3);border-radius:3px;overflow:hidden"><div style="width:${Math.round(count/COMPANIES.length*100)}%;height:100%;background:${cls==='tag-s'?'var(--ok)':cls==='tag-a'?'var(--accent)':cls==='tag-d'?'var(--ng)':'var(--warn)'}"></div></div><span style="font-family:'Bebas Neue';font-size:20px;width:28px;text-align:right">${count}</span></div>`;}).join('')}</div><div class="panel"><div class="panel-title">コース別分布（2期）</div>${['リーダー育成','事業共創',''].map(ct=>{const label=ct||'未定';const count=COMPANIES.filter(c=>(c.course2||'')===ct).length;if(!count)return'';const colors={'リーダー育成':'var(--accent)','事業共創':'var(--ok)','未定':'var(--td)'};return`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border)"><span style="font-size:11px;color:${colors[label]||'var(--td)'};font-weight:700;width:90px">${label}</span><div style="flex:1;height:6px;background:var(--surface3);border-radius:3px;overflow:hidden"><div style="width:${Math.round(count/COMPANIES.length*100)}%;height:100%;background:${colors[label]||'var(--td)'}"></div></div><span style="font-family:'Bebas Neue';font-size:20px;width:28px;text-align:right">${count}</span></div>`;}).join('')}</div><div class="panel"><div class="panel-title">要注意・フォローアップ</div>${COMPANIES.filter(c=>getContract(c.no)==='C：社内調整中'||(c.ent_sat!=null&&c.ent_sat<7)).slice(0,6).map(c=>{const risk=getContract(c.no)==='C：社内調整中'?'社内調整中':`満足度${c.ent_sat}`;return`<div style="display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--border)"><span style="font-size:12px;font-weight:600;flex:1;cursor:pointer;color:var(--accent)" onclick="goToCompany(${c.no})">${esc(c.short)}</span><span style="font-size:10px;padding:2px 7px;border-radius:4px;background:var(--warn-lt);color:var(--warn);font-weight:700">${risk}</span></div>`;}).join('')||'<div style="color:var(--td);font-size:12px">リスク企業なし</div>'}</div></div>`;
  document.getElementById('page-overview').innerHTML=html;
}
function goToCompany(no){currentCompanyNo=no;switchMainTab('company');}

// ── ページ離脱前に確実に保存 ──
window.addEventListener('beforeunload', function(){
  // 未完了のsaveをフラッシュ（同期的には無理だがキャンセルを防ぐ）
  Object.keys(LSdb._saving).forEach(k=>clearTimeout(LSdb._saving[k]));
});

// ── 起動: Supabaseからデータをロードしてから描画 ──
(async function init(){
  try {
    await LSdb.loadAll();
  } catch(e) {
    console.warn('[init] Supabase load failed, using local cache:', e.message);
    LSdb._loaded = true;  // 失敗時もフラグを立てて続行
  }
  renderOverview();
  // グローバルユーザーセレクトを初期化
  initGlobalUserSelect();
})();

function initGlobalUserSelect(){
  const sel = document.getElementById('global-user-select');
  if(!sel) return;
  sel.innerHTML = '<option value="" style="background:#1e293b">未選択</option>' +
    getUsers().map(u=>`<option value="${esc(u.id)}" style="background:#1e293b;color:#fff" ${getCurrentUser()===u.id?'selected':''}>${esc(u.name)}</option>`).join('');
}

// ━━━ 企業情報編集 ━━━

function getCoInfo(no){
  const ov = LS.get('co_info_'+no);
  const base = COMPANIES.find(c=>c.no===no) || {};
  return {...base, ...ov};
}

function saveCoInfo(no){
  const fields = ['name','short','rep','addr','price','course1','course2',
                  'ai','camp','vision','short_goal','escort','success',
                  'ent_sat','ent_grow','ent_recommend'];
  const ov = LS.get('co_info_'+no) || {};
  fields.forEach(f=>{
    const el = document.getElementById('co-edit-'+f+'-'+no);
    if(!el) return;
    const v = el.value;
    if(f==='price'||f==='ent_sat'||f==='ent_grow'||f==='ent_recommend'){
      const n = parseFloat(v);
      if(!isNaN(n)) ov[f] = n;
    } else {
      ov[f] = v;
    }
  });
  // CSスタッフ保存
  const csStaff = getCoCSStaff(no);
  ov._cs_staff = csStaff;
  LS.set('co_info_'+no, ov);
  // サイドバー名更新
  const sbEl = document.getElementById('sb-item-'+no);
  if(sbEl){ const nameEl=sbEl.querySelector('.sb-name'); if(nameEl) nameEl.textContent=ov.short||ov.name||''; }
  toast('💾 企業情報を保存しました');
  const area = document.getElementById('co-main-area');
  const c2 = getCoInfo(no);
  if(area) area.innerHTML = renderCompanyPage(c2);
}

function resetCoInfo(no){
  if(!confirm('企業情報の変更をリセットしますか？（初期データに戻ります）')) return;
  LS.set('co_info_'+no, {});
  const c = COMPANIES.find(x=>x.no===no);
  const area = document.getElementById('co-main-area');
  if(c && area) area.innerHTML = renderCompanyPage(c);
  toast('🔄 リセットしました');
}

// ━━━ CS担当スタッフ管理 ━━━
// cs_staff: [{role:'NEO担当責任者', name:'古野絢太'}, ...]

function getCoCSStaff(no){
  const ov = LS.get('co_info_'+no);
  if(ov._cs_staff && Array.isArray(ov._cs_staff)) return ov._cs_staff;
  // 初期値: 既存のcs フィールドから生成
  const base = COMPANIES.find(c=>c.no===no);
  if(base?.cs) return [{role:'NEO担当者', name: base.cs}];
  return [];
}

function saveCoCSStaff(no, staff){
  const ov = LS.get('co_info_'+no) || {};
  ov._cs_staff = staff;
  LS.set('co_info_'+no, ov);
}

function renderCSStaffEditor(no){
  const staff = getCoCSStaff(no);
  const roles = ['NEO担当責任者','NEO担当者','NEO広報担当者','サポートメンバー','その他'];
  const rows = staff.map((s,i)=>`
    <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px" id="cs-row-${no}-${i}">
      <select onchange="updateCSStaffField(${no},${i},'role',this.value)"
        style="padding:5px 8px;border:1px solid var(--border);border-radius:5px;font-size:11px;color:var(--t1);background:var(--surface2);outline:none;flex-shrink:0">
        ${roles.map(r=>`<option value="${r}" ${s.role===r?'selected':''}>${r}</option>`).join('')}
      </select>
      <input type="text" value="${esc(s.name)}"
        onchange="updateCSStaffField(${no},${i},'name',this.value)"
        placeholder="担当者名"
        style="flex:1;padding:5px 8px;border:1px solid var(--border);border-radius:5px;font-size:12px;color:var(--t1);background:var(--surface2);outline:none">
      <button onclick="removeCSStaff(${no},${i})"
        style="padding:4px 8px;border:1px solid var(--border);border-radius:5px;background:var(--surface2);color:var(--td);cursor:pointer;font-size:11px"
        onmouseover="this.style.color='var(--ng)'" onmouseout="this.style.color='var(--td)'">✕</button>
    </div>`).join('');

  return `<div id="cs-staff-editor-${no}">
    ${rows}
    <button onclick="addCSStaff(${no})"
      style="padding:5px 14px;border:1px dashed var(--accent);border-radius:6px;
        background:var(--accent-lt);color:var(--accent);cursor:pointer;font-size:11px;font-weight:700;width:100%;margin-top:4px">
      ＋ 担当者を追加
    </button>
  </div>`;
}

function addCSStaff(no){
  const staff = getCoCSStaff(no);
  staff.push({role:'NEO担当者', name:''});
  saveCoCSStaff(no, staff);
  const el = document.getElementById('cs-staff-editor-'+no);
  if(el) el.outerHTML = renderCSStaffEditor(no);
  toast('担当者欄を追加しました');
}

function removeCSStaff(no, idx){
  const staff = getCoCSStaff(no);
  staff.splice(idx, 1);
  saveCoCSStaff(no, staff);
  const el = document.getElementById('cs-staff-editor-'+no);
  if(el) el.outerHTML = renderCSStaffEditor(no);
}

function updateCSStaffField(no, idx, field, value){
  const staff = getCoCSStaff(no);
  if(staff[idx]) staff[idx][field] = value;
  saveCoCSStaff(no, staff);
}

function toggleCoEdit(no){
  const viewEl    = document.getElementById('co-view-'+no);
  const editEl    = document.getElementById('co-edit-'+no);
  const toggleBtn = document.getElementById('co-edit-toggle-'+no);
  const saveBtn   = document.getElementById('co-edit-save-'+no);
  const cancelBtn = document.getElementById('co-edit-cancel-'+no);
  if(!viewEl||!editEl) return;
  const isEditing = editEl.style.display !== 'none';
  viewEl.style.display    = isEditing ? 'block' : 'none';
  editEl.style.display    = isEditing ? 'none'  : 'block';
  if(toggleBtn) toggleBtn.style.display = isEditing ? 'block' : 'none';
  if(saveBtn)   saveBtn.style.display   = isEditing ? 'none'  : 'block';
  if(cancelBtn) cancelBtn.style.display = isEditing ? 'none'  : 'block';
}
</script>
</body>
