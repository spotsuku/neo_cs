<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEO ACADEMIA — Partner Success Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700;900&family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f7f8fa;
  --surface: #ffffff;
  --surface2: #f1f4f9;
  --surface3: #e4eaf3;
  --t1: #0e1a2b;
  --t2: #2d3f55;
  --td: #5a7090;
  --t-muted: #96adc4;
  --border: #dde5f0;
  --border2: #c8d5e8;
  --accent: #1a56db;
  --accent-lt: #ddeeff;
  --ok: #059669;
  --ok-lt: #d1fae5;
  --warn: #d97706;
  --warn-lt: #fef3c7;
  --ng: #dc2626;
  --ng-lt: #fee2e2;
  --purple: #7c3aed;
  --purple-lt: #ede9fe;
  --teal: #0891b2;
  --teal-lt: #cffafe;
  --radius: 10px;
  --shadow: 0 2px 12px rgba(14,26,43,.07);
  --shadow-lg: 0 8px 32px rgba(14,26,43,.12);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Noto Sans JP', sans-serif; background: var(--bg); color: var(--t1); min-height: 100vh; }

/* ── TOP NAV ── */
.top-nav {
  position: sticky; top: 0; z-index: 300;
  background: #0e1a2b;
  display: flex; align-items: center; padding: 0 24px; height: 54px;
  box-shadow: 0 2px 20px rgba(0,0,0,.3);
}
.top-logo {
  font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 4px;
  color: #fff; margin-right: 28px; padding-right: 24px;
  border-right: 1px solid #2d4060;
  white-space: nowrap;
}
.top-logo span { color: #4da6ff; }
.top-badge {
  background: #1a56db; color: #fff; font-size: 10px; font-weight: 700;
  padding: 3px 10px; border-radius: 4px; letter-spacing: 2px;
  font-family: 'Space Mono', monospace; margin-right: 20px;
}
.nav-tabs { display: flex; gap: 2px; flex: 1; }
.nav-tab {
  padding: 0 18px; height: 54px; display: flex; align-items: center;
  font-size: 12px; font-weight: 500; color: #7899bb; cursor: pointer;
  border-bottom: 3px solid transparent; transition: all .15s; white-space: nowrap;
  letter-spacing: .3px;
}
.nav-tab:hover { color: #c5dff8; background: rgba(255,255,255,.04); }
.nav-tab.active { color: #4da6ff; border-bottom-color: #4da6ff; font-weight: 700; }

/* ── LAYOUT ── */
.app { display: flex; height: calc(100vh - 54px); }

/* ── SIDEBAR ── */
.sidebar {
  width: 268px; flex-shrink: 0; background: var(--surface);
  border-right: 1px solid var(--border); display: flex; flex-direction: column;
  overflow: hidden;
}
.sb-header { padding: 14px 16px 10px; border-bottom: 1px solid var(--border); }
.sb-title { font-size: 9px; font-family: 'Space Mono', monospace; color: var(--td); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 10px; }
.sb-search {
  position: relative;
}
.sb-search input {
  width: 100%; padding: 8px 10px 8px 30px; border-radius: 7px;
  border: 1px solid var(--border); background: var(--surface2);
  font-size: 12px; color: var(--t1); font-family: 'Noto Sans JP', sans-serif;
  outline: none; transition: all .15s;
}
.sb-search input:focus { border-color: var(--accent); background: var(--surface); }
.sb-search::before { content: '🔍'; position: absolute; left: 9px; top: 50%; transform: translateY(-50%); font-size: 11px; pointer-events: none; }
.sb-filters { display: flex; gap: 6px; padding: 8px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.sb-filter-btn {
  font-size: 9px; font-family: 'Space Mono', monospace; padding: 3px 8px;
  border-radius: 4px; border: 1px solid var(--border); cursor: pointer;
  color: var(--td); background: var(--surface); transition: all .15s; font-weight: 700;
}
.sb-filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.sb-list { flex: 1; overflow-y: auto; }
.sb-list::-webkit-scrollbar { width: 4px; }
.sb-list::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

.sb-item {
  display: flex; align-items: center; gap: 8px; padding: 10px 16px;
  cursor: pointer; transition: all .12s; border-left: 3px solid transparent;
  border-bottom: 1px solid var(--border);
}
.sb-item:hover { background: var(--accent-lt); }
.sb-item.active { background: var(--accent-lt); border-left-color: var(--accent); }
.sb-av {
  width: 34px; height: 34px; border-radius: 8px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Bebas Neue', sans-serif; font-size: 16px; font-weight: 700;
}
.sb-info { flex: 1; min-width: 0; }
.sb-name { font-size: 11px; font-weight: 600; color: var(--t1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-meta { font-size: 9px; color: var(--td); margin-top: 2px; font-family: 'Space Mono', monospace; }
.sb-right { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
.health-dot { width: 8px; height: 8px; border-radius: 50%; }
.contract-tag { font-size: 8px; font-weight: 700; padding: 1px 5px; border-radius: 3px; font-family: 'Space Mono', monospace; }

/* ── MAIN ── */
.main { flex: 1; overflow-y: auto; }
.main::-webkit-scrollbar { width: 6px; }
.main::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* ── PAGES ── */
.page { display: none; padding: 28px 36px 80px; animation: fadein .2s ease; }
.page.active { display: block; }
@keyframes fadein { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }

/* ── OVERVIEW PAGE ── */
.ov-kpi-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 24px; }
.ov-kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); text-align: center; }
.ov-kpi-label { font-size: 9px; font-family: 'Space Mono', monospace; color: var(--td); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 8px; }
.ov-kpi-val { font-family: 'Bebas Neue', sans-serif; font-size: 40px; line-height: 1; }
.ov-kpi-sub { font-size: 10px; color: var(--td); margin-top: 4px; }

.section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 2px solid var(--border); }
.section-num { width: 24px; height: 24px; background: var(--accent); color: #fff; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; font-family: 'Space Mono', monospace; flex-shrink: 0; }
.section-title { font-size: 14px; font-weight: 700; color: var(--t1); }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; margin-bottom: 20px; }
.panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.panel-title { font-size: 10px; font-weight: 700; color: var(--td); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }

/* ── HEALTH MATRIX ── */
.health-matrix { overflow-x: auto; margin-bottom: 24px; }
.hm-table { width: 100%; border-collapse: collapse; font-size: 12px; min-width: 700px; }
.hm-table thead th { background: var(--surface2); padding: 8px 12px; text-align: left; font-size: 10px; font-family: 'Space Mono', monospace; color: var(--td); border-bottom: 2px solid var(--border); white-space: nowrap; }
.hm-table tbody td { padding: 9px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.hm-table tbody tr:hover { background: var(--surface2); }
.hm-table tbody tr.is-new { background: #fffdf0; }
.co-name-cell { font-weight: 700; color: var(--t1); white-space: nowrap; cursor: pointer; }
.co-name-cell:hover { color: var(--accent); text-decoration: underline; }
.cs-tag { font-size: 10px; padding: 2px 7px; border-radius: 4px; font-weight: 600; font-family: 'Space Mono', monospace; white-space: nowrap; }
.tag-s { background: var(--ok-lt); color: var(--ok); }
.tag-a { background: var(--accent-lt); color: var(--accent); }
.tag-b { background: var(--warn-lt); color: var(--warn); }
.tag-c { background: #fff7ed; color: #ea580c; }
.tag-d { background: var(--ng-lt); color: var(--ng); }
.tag-new { background: var(--purple-lt); color: var(--purple); }
.score-pill { font-family: 'Bebas Neue', sans-serif; font-size: 18px; }
.health-bar-wrap { display: flex; align-items: center; gap: 8px; }
.health-bar { height: 6px; background: var(--surface3); border-radius: 3px; flex: 1; overflow: hidden; }
.health-bar-fill { height: 100%; border-radius: 3px; }
.onbo-pips { display: flex; gap: 3px; flex-wrap: wrap; max-width: 120px; }
.pip { width: 8px; height: 8px; border-radius: 2px; }

/* ── COMPANY PAGE ── */
.co-header { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 2px solid var(--border); }
.co-number { font-family: 'Space Mono', monospace; font-size: 9px; color: var(--t-muted); letter-spacing: 3px; margin-bottom: 4px; }
.co-name { font-family: 'Bebas Neue', sans-serif; font-size: 44px; letter-spacing: 2px; line-height: 1.05; color: var(--t1); }
.co-meta { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; align-items: center; }
.badge { display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 5px; font-size: 10px; font-weight: 700; font-family: 'Space Mono', monospace; border: 1px solid; }
.b-ok { background: var(--ok-lt); color: var(--ok); border-color: #6ee7b7; }
.b-accent { background: var(--accent-lt); color: var(--accent); border-color: #93c5fd; }
.b-warn { background: var(--warn-lt); color: var(--warn); border-color: #fcd34d; }
.b-ng { background: var(--ng-lt); color: var(--ng); border-color: #fca5a5; }
.b-purple { background: var(--purple-lt); color: var(--purple); border-color: #c4b5fd; }
.b-gray { background: var(--surface2); color: var(--td); border-color: var(--border2); }

.co-kpi-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 20px; }
.co-kpi { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); text-align: center; }
.co-kpi-label { font-size: 9px; font-family: 'Space Mono', monospace; color: var(--td); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 8px; }
.co-kpi-val { font-family: 'Bebas Neue', sans-serif; font-size: 34px; line-height: 1; }
.co-kpi-sub { font-size: 10px; color: var(--td); margin-top: 3px; }

/* ── INNER TABS ── */
.inner-tabs { display: flex; border-bottom: 2px solid var(--border); margin-bottom: 18px; }
.inner-tab { padding: 9px 18px; font-size: 12px; font-weight: 500; color: var(--td); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -2px; transition: all .15s; }
.inner-tab:hover { color: var(--t1); }
.inner-tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
.inner-content { display: none; }
.inner-content.active { display: block; }

/* ── CARD PLAN ── */
.plan-section { margin-bottom: 18px; }
.plan-label { font-size: 9px; font-family: 'Space Mono', monospace; color: var(--td); letter-spacing: 2px; text-transform: uppercase; margin-bottom: 6px; font-weight: 700; }
.plan-textarea {
  width: 100%; min-height: 80px; padding: 10px 14px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--surface2);
  font-size: 13px; color: var(--t1); font-family: 'Noto Sans JP', sans-serif;
  line-height: 1.7; outline: none; resize: vertical; transition: all .15s;
}
.plan-textarea:focus { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 3px rgba(26,86,219,.08); }
.plan-save-btn {
  margin-top: 12px; padding: 9px 22px; background: var(--accent); color: #fff;
  border: none; border-radius: 7px; font-size: 12px; font-weight: 700;
  cursor: pointer; font-family: 'Space Mono', monospace; letter-spacing: 1px;
  transition: all .15s;
}
.plan-save-btn:hover { background: #1446b8; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(26,86,219,.3); }
.plan-saved-flash { animation: flash .5s ease; }
@keyframes flash { 0% { border-color: var(--ok); background: #f0fdf4; } 100% { border-color: var(--border); background: var(--surface2); } }

/* ── MEETING LOG ── */
.meeting-log { margin-bottom: 16px; }
.meeting-add { display: flex; gap: 10px; margin-bottom: 14px; }
.meeting-date-input, .meeting-text-input {
  padding: 8px 12px; border-radius: 7px; border: 1px solid var(--border);
  background: var(--surface2); color: var(--t1); font-size: 12px;
  font-family: 'Noto Sans JP', sans-serif; outline: none; transition: all .15s;
}
.meeting-date-input { width: 140px; flex-shrink: 0; }
.meeting-text-input { flex: 1; }
.meeting-date-input:focus, .meeting-text-input:focus { border-color: var(--accent); background: var(--surface); }
.meeting-add-btn {
  padding: 8px 16px; background: var(--ok); color: #fff; border: none; border-radius: 7px;
  font-size: 11px; font-weight: 700; cursor: pointer; font-family: 'Space Mono', monospace;
  flex-shrink: 0; transition: all .15s;
}
.meeting-add-btn:hover { background: #047857; }
.meeting-item {
  display: flex; gap: 12px; padding: 12px 14px; background: var(--surface2);
  border-radius: 8px; margin-bottom: 8px; border-left: 3px solid var(--accent);
  align-items: flex-start;
}
.meeting-date-tag { font-family: 'Space Mono', monospace; font-size: 10px; color: var(--td); font-weight: 700; flex-shrink: 0; padding-top: 2px; min-width: 80px; }
.meeting-body { flex: 1; font-size: 13px; color: var(--t2); line-height: 1.7; }
.meeting-delete { font-size: 12px; color: var(--t-muted); cursor: pointer; padding: 2px 6px; border-radius: 4px; transition: all .15s; flex-shrink: 0; }
.meeting-delete:hover { background: var(--ng-lt); color: var(--ng); }
.meeting-empty { color: var(--td); font-size: 13px; padding: 20px; text-align: center; background: var(--surface2); border-radius: 8px; }

/* ── ONBOARDING ── */
.onbo-phase { margin-bottom: 20px; }
.onbo-phase-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.onbo-phase-title { font-size: 12px; font-weight: 700; color: var(--t2); }
.onbo-phase-progress { font-family: 'Bebas Neue', sans-serif; font-size: 20px; }
.onbo-tasks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.onbo-task {
  display: flex; align-items: center; gap: 8px; padding: 8px 10px;
  border-radius: 7px; background: var(--surface2); cursor: pointer;
  transition: all .15s; border: 1px solid transparent;
}
.onbo-task:hover { background: var(--surface3); }
.onbo-task.done { background: var(--ok-lt); border-color: #6ee7b7; }
.onbo-task-check {
  width: 18px; height: 18px; border-radius: 5px; border: 2px solid var(--border2);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 11px; transition: all .15s;
}
.onbo-task.done .onbo-task-check { background: var(--ok); border-color: var(--ok); color: #fff; }
.onbo-task-label { font-size: 11px; color: var(--t2); line-height: 1.4; }
.onbo-task.done .onbo-task-label { color: var(--ok); font-weight: 600; }

/* ── SURVEY DISPLAY ── */
.survey-score-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; }
.survey-score-box { background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; text-align: center; flex: 1; min-width: 80px; }
.survey-score-val { font-family: 'Bebas Neue', sans-serif; font-size: 32px; line-height: 1; }
.survey-score-label { font-size: 9px; color: var(--td); margin-top: 4px; }
.survey-comment { background: var(--surface2); border-radius: 8px; padding: 12px 14px; margin-bottom: 10px; border-left: 3px solid var(--accent); }
.survey-comment-label { font-size: 9px; font-family: 'Space Mono', monospace; color: var(--td); letter-spacing: 1px; font-weight: 700; margin-bottom: 5px; text-transform: uppercase; }
.survey-comment-body { font-size: 12px; color: var(--t2); line-height: 1.75; }
.no-data-msg { color: var(--td); font-size: 13px; padding: 24px; text-align: center; background: var(--surface2); border-radius: 8px; }

/* ── CONTACTS ── */
.contact-card { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; background: var(--surface2); border-radius: 8px; margin-bottom: 8px; }
.contact-av { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: #fff; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 18px; flex-shrink: 0; }
.contact-info { flex: 1; }
.contact-name { font-size: 14px; font-weight: 700; color: var(--t1); }
.contact-role { font-size: 11px; color: var(--td); margin-top: 2px; }
.contact-email { font-size: 11px; color: var(--accent); margin-top: 4px; font-family: 'Space Mono', monospace; }
.contact-tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 6px; }
.contact-tag { font-size: 9px; padding: 2px 7px; border-radius: 4px; font-weight: 700; }

/* ── TOAST ── */
#toast { position: fixed; bottom: 24px; right: 24px; background: var(--ok); color: #fff; padding: 10px 18px; border-radius: 7px; font-size: 12px; font-weight: 700; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 9999; box-shadow: 0 4px 20px rgba(5,150,105,.4); }
#toast.show { opacity: 1; }

/* ── RISK BANNER ── */
.risk-banner { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; margin-bottom: 16px; }
.risk-banner.danger { background: var(--ng-lt); border: 1px solid #fca5a5; }
.risk-banner.warn { background: var(--warn-lt); border: 1px solid #fcd34d; }
.risk-banner.ok { background: var(--ok-lt); border: 1px solid #6ee7b7; }
.risk-icon { font-size: 18px; }
.risk-text { font-size: 13px; font-weight: 600; }

/* ── HEATMAP ── */
.heatmap-row { display: flex; gap: 4px; margin-bottom: 6px; align-items: center; }
.heatmap-label { font-size: 11px; color: var(--td); width: 100px; text-align: right; flex-shrink: 0; }
.heatmap-cell { height: 28px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; cursor: pointer; transition: transform .1s; font-family: 'Space Mono', monospace; }
.heatmap-cell:hover { transform: scale(1.05); }

/* ACTION ITEMS */
.action-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; background: var(--surface2); border-radius: 7px; margin-bottom: 7px; border-left: 3px solid; }
.action-check { width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--border2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; transition: all .15s; margin-top: 1px; }
.action-check.done { background: var(--ok); border-color: var(--ok); color: #fff; }
.action-body { flex: 1; }
.action-text { font-size: 13px; color: var(--t2); }
.action-text.done { text-decoration: line-through; color: var(--t-muted); }
.action-due { font-size: 10px; color: var(--t-muted); margin-top: 3px; font-family: 'Space Mono', monospace; }
.action-delete { color: var(--t-muted); cursor: pointer; font-size: 12px; padding: 2px 5px; }
.action-delete:hover { color: var(--ng); }
.action-add { display: flex; gap: 8px; margin-top: 10px; }

@media (max-width: 1100px) {
  .ov-kpi-row { grid-template-columns: repeat(3, 1fr); }
  .co-kpi-row { grid-template-columns: repeat(3, 1fr); }
  .grid2, .grid3 { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<nav class="top-nav">
  <div class="top-logo">NEO <span>ACADEMIA</span></div>
  <div class="top-badge">PARTNER SUCCESS</div>
  <div class="nav-tabs">
    <div class="nav-tab active" id="ntab-overview" onclick="switchMainTab('overview')">🏠 概要ダッシュボード</div>
    <div class="nav-tab" id="ntab-company" onclick="switchMainTab('company')">🏢 企業カルテ</div>
    <div class="nav-tab" id="ntab-onboarding" onclick="switchMainTab('onboarding')">📋 オンボーディング</div>
    <div class="nav-tab" id="ntab-meetings" onclick="switchMainTab('meetings')">📅 定例面談</div>
    <div class="nav-tab" id="ntab-survey" onclick="switchMainTab('survey')">📊 アンケート分析</div>
  </div>
</nav>

<div class="app" id="app-company" style="display:none">
  <!-- company-view sidebar+main rendered by JS -->
</div>

<div id="page-overview" class="page active" style="padding:28px 36px 80px">
  <!-- Overview rendered by JS -->
</div>

<div id="toast"></div>

<script>
// ══════════════════════════════════════════════
// DATA

// ══ UTILITIES ══
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function scColor(v) { const n=parseFloat(v); if(isNaN(n)) return '#94a3b8'; if(n>=8) return '#059669'; if(n>=6) return '#d97706'; return '#dc2626'; }
function contractInfo(c) {
  const map = { 'S：契約書締結':['tag-s','S'], 'A：契約中':['tag-a','A'], 'B：内諾確認済':['tag-b','B'], 'C：社内調整中':['tag-c','C'], 'D：非継続':['tag-d','D'] };
  return map[c] || ['tag-s','?'];
}
function toast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}
function avatarColor(name) {
  const colors = [['#2563eb','#dbeafe'],['#059669','#d1fae5'],['#d97706','#fef3c7'],['#7c3aed','#ede9fe'],['#0891b2','#cffafe'],['#db2777','#fce7f3']];
  const idx = (name||'').charCodeAt(0) % colors.length;
  return colors[idx];
}

// ══ MAIN TAB SWITCH ══
let currentMainTab = 'overview';
let currentCompanyNo = 1;

function switchMainTab(tab) {
  ['overview'].forEach(id => {
    const el = document.getElementById('page-'+id);
    if(el) el.classList.toggle('active', id === tab);
  });
  document.getElementById('app-company').style.display = ['company','onboarding','meetings','survey'].includes(tab) ? 'flex' : 'none';
  document.getElementById('page-overview').style.display = tab === 'overview' ? '' : 'none';

  ['overview','company','onboarding','meetings','survey'].forEach(t => {
    const btn = document.getElementById('ntab-'+t);
    if(btn) btn.classList.toggle('active', t === tab);
  });
  currentMainTab = tab;

  if(tab !== 'overview') {
    renderAppLayout(tab);
  }
}

let sbFilter = 'all';
function setSbFilter(btn, filter) {
  document.querySelectorAll('.sb-filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  sbFilter = filter;
  filterSidebar(document.getElementById('sb-search-input')?.value || '');
}
function filterSidebar(q) {
  const items = document.querySelectorAll('.sb-item');
  const lower = q.toLowerCase();
  items.forEach(item => {
    const name = (item.dataset.name||'').toLowerCase();
    const contract = item.dataset.contract||'';
    const status = item.dataset.status||'';
    let show = name.indexOf(lower) >= 0;
    if(sbFilter === 'active') show = show && contract !== 'D：非継続';
    if(sbFilter === 'new') show = show && status === '新規契約';
    if(sbFilter === 'disc') show = show && contract === 'D：非継続';
    item.style.display = show ? '' : 'none';
  });
}

function renderSidebarList(cos, activeNo) {
  return cos.map(c => {
    const [cls, label] = contractInfo(c.contract);
    const health = getHealthScore(c);
    const hColor = health >= 7 ? '#059669' : health >= 5 ? '#d97706' : '#dc2626';
    const [bg, fg] = avatarColor(c.name);
    return `<div class="sb-item ${c.no === activeNo ? 'active' : ''}" onclick="selectCompany(${c.no})" id="sb-item-${c.no}" data-name="${c.short.toLowerCase()}" data-contract="${c.contract}" data-status="${c.status}">
      <div class="sb-av" style="background:${fg};color:${bg}">${c.short[0]}</div>
      <div class="sb-info">
        <div class="sb-name">${esc(c.short)}</div>
        <div class="sb-meta">${c.course2||c.course1||'—'} · CS:${esc(c.cs)||'未定'}</div>
      </div>
      <div class="sb-right">
        <div class="health-dot" style="background:${hColor}" title="健全スコア:${health}"></div>
        <span class="contract-tag ${cls}">${label}</span>
      </div>
    </div>`;
  }).join('');
}

function selectCompany(no) {
  currentCompanyNo = no;
  document.querySelectorAll('.sb-item').forEach(el => el.classList.remove('active'));
  const sb = document.getElementById('sb-item-'+no);
  if(sb) { sb.classList.add('active'); sb.scrollIntoView({block:'nearest'}); }
  const mainArea = document.getElementById('co-main-area');
  if(mainArea) mainArea.innerHTML = renderTabContent(currentMainTab, no);
}

function getHealthScore(c) {
  let score = 5;
  if(c.contract === 'S：契約書締結' || c.contract === 'A：契約中') score += 2;
  if(c.contract === 'B：内諾確認済') score += 1;
  if(c.contract === 'D：非継続') score -= 2;
  if(c.ent_sat != null && c.ent_sat >= 8) score += 1;
  if(c.ent_sat != null && c.ent_sat < 6) score -= 1;
  const meetings = LS.getArr('meetings_'+c.no);
  if(meetings.length >= 3) score += 1;
  return Math.max(1, Math.min(10, score));
}

// ══ TAB CONTENT RENDERER ══
function renderTabContent(tab, no) {
  const c = COMPANIES.find(x => x.no === no);
  if(!c) return '';
  switch(tab) {
    case 'company': return renderCompanyPage(c);
    case 'onboarding': return renderOnboardingPage(c);
    case 'meetings': return renderMeetingsPage(c);
    case 'survey': return renderSurveyPage(c);
    default: return '';
  }
}

function renderActions(no) {
  const actions = LS.getArr('actions_'+no);
  const inputsHtml = `<div class="action-add">

      <div class="action-body">

        ${a.due ? `<div class="action-due">期限: ${esc(a.due)}</div>` : ''}

      <span class="action-delete" onclick="deleteAction(${no},${i})">✕</span>

function addAction(no) {
  const text = document.getElementById('action-text-'+no)?.value?.trim();
  const due = document.getElementById('action-due-'+no)?.value;
  if(!text) return;
  const actions = LS.getArr('actions_'+no);
  actions.unshift({text, due, done:false});
  LS.setArr('actions_'+no, actions);
  document.getElementById('action-text-'+no).value = '';
  document.getElementById('action-due-'+no).value = '';
  const c = COMPANIES.find(x=>x.no===no);
  const container = document.getElementById('actions-'+no);
  if(container) container.innerHTML = renderActions(no);
  toast('アクションを追加しました');
}
function toggleAction(no, i) {
  const actions = LS.getArr('actions_'+no);
  if(actions[i]) { actions[i].done = !actions[i].done; LS.setArr('actions_'+no, actions); }
  const container = document.getElementById('actions-'+no);
  if(container) container.innerHTML = renderActions(no);
}
function deleteAction(no, i) {
  const actions = LS.getArr('actions_'+no);
  actions.splice(i, 1);
  LS.setArr('actions_'+no, actions);
  const container = document.getElementById('actions-'+no);
  if(container) container.innerHTML = renderActions(no);
}

function savePlan(no) {
  const plans = {
    vision: document.getElementById('plan-vision-'+no)?.value,
    short_goal: document.getElementById('plan-goal-'+no)?.value,
    escort: document.getElementById('plan-escort-'+no)?.value,
    success: document.getElementById('plan-success-'+no)?.value,
  };
  LS.set('plans_'+no, plans);
  ['vision','goal','escort','success'].forEach(k => {
    const el = document.getElementById('plan-'+(k===k?k:k)+'-'+no);
    if(el) { el.classList.remove('plan-saved-flash'); void el.offsetWidth; el.classList.add('plan-saved-flash'); }
  });
  toast('💾 保存しました');
}

function renderOnboardingPage(c) {
  const tasks_key = 'onbo_'+c.no;
  const done = LS.get(tasks_key);
  let totalTasks = 0, doneTasks = 0;
  ONBO_PHASES.forEach(p => { totalTasks += p.tasks.length; p.tasks.forEach(t => { if(done[t]) doneTasks++; }); });
  const pct = totalTasks > 0 ? Math.round(doneTasks/totalTasks*100) : 0;

  return `<div style="padding:28px 36px 80px">
    <div style="margin-bottom:20px">
      <h2 style="font-family:'Bebas Neue';font-size:36px;letter-spacing:2px">${esc(c.short)}</h2>
      <div style="font-size:13px;color:var(--td);margin-top:4px">オンボーディング進捗</div>
    </div>
    <div class="panel" style="margin-bottom:24px">
      <div style="display:flex;align-items:center;gap:16px">
        <div style="flex:1">
          <div style="display:flex;justify-content:space-between;margin-bottom:8px">
            <span style="font-size:13px;font-weight:700">総合進捗</span>
            <span style="font-family:'Bebas Neue';font-size:22px;color:${pct===100?'var(--ok)':pct>=50?'var(--warn)':'var(--ng)'}">${pct}%</span>
          </div>
          <div style="height:10px;background:var(--surface3);border-radius:5px;overflow:hidden">
            <div style="width:${pct}%;height:100%;background:${pct===100?'var(--ok)':pct>=50?'var(--warn)':'var(--accent)'};border-radius:5px;transition:width .5s"></div>
          </div>
          <div style="font-size:11px;color:var(--td);margin-top:6px">${doneTasks} / ${totalTasks} 完了</div>
        </div>
        <button onclick="resetOnboarding(${c.no})" style="padding:6px 14px;border:1px solid var(--border);background:var(--surface2);border-radius:6px;font-size:11px;cursor:pointer;color:var(--td);transition:all .15s" onmouseover="this.style.color='var(--ng)'" onmouseout="this.style.color='var(--td)'">リセット</button>
      </div>
    </div>
    ${ONBO_PHASES.map(phase => {
      const pDone = phase.tasks.filter(t=>done[t]).length;
      return `<div class="onbo-phase">
        <div class="onbo-phase-header">
          <div class="onbo-phase-title" style="color:${phase.color}">${esc(phase.title)}</div>
          <div class="onbo-phase-progress" style="color:${pDone===phase.tasks.length?'var(--ok)':'var(--td)'}">${pDone}/${phase.tasks.length}</div>
        </div>
        <div class="onbo-tasks">
          ${phase.tasks.map(t => `
            <div class="onbo-task ${done[t]?'done':''}" onclick="toggleOnbo(${c.no},'${t.replace(/'/g,"\\'")}')">
              <div class="onbo-task-check">${done[t]?'✓':''}</div>
              <div class="onbo-task-label">${esc(t)}</div>
            </div>`).join('')}
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function toggleOnbo(no, task) {
  const key = 'onbo_'+no;
  const done = LS.get(key);
  done[task] = !done[task];
  LS.set(key, done);
  const c = COMPANIES.find(x=>x.no===no);
  if(c) document.getElementById('co-main-area').innerHTML = renderOnboardingPage(c);
  toast(done[task] ? '✅ 完了しました' : '↩ 未完了に戻しました');
}
function resetOnboarding(no) {
  if(!confirm('オンボーディングの進捗をリセットしますか？')) return;
  LS.set('onbo_'+no, {});
  const c = COMPANIES.find(x=>x.no===no);
  if(c) document.getElementById('co-main-area').innerHTML = renderOnboardingPage(c);
}

function addMeeting(no) {
  const date = document.getElementById('mt-date-'+no)?.value;
  const text = document.getElementById('mt-text-'+no)?.value?.trim();
  if(!text) return;
  const meetings = LS.getArr('meetings_'+no);
  meetings.unshift({date: date||new Date().toISOString().split('T')[0], text});
  LS.setArr('meetings_'+no, meetings);
  document.getElementById('mt-text-'+no).value = '';
  const listEl = document.getElementById('meeting-list-'+no);
  if(listEl) listEl.innerHTML = renderMeetingList(no);
  const c = COMPANIES.find(x=>x.no===no);
  toast('📅 面談ログを追加しました');
}
function deleteMeeting(no, i) {
  const meetings = LS.getArr('meetings_'+no);
  meetings.splice(i, 1);
  LS.setArr('meetings_'+no, meetings);
  const listEl = document.getElementById('meeting-list-'+no);
  if(listEl) listEl.innerHTML = renderMeetingList(no);
}

// ══ INNER TAB SWITCH ══
function switchInner(el, targetId, tabsId) {
  const tabsContainer = document.getElementById(tabsId);
  if(!tabsContainer) return;
  tabsContainer.querySelectorAll('.inner-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  // find all inner-content siblings
  const mainContent = tabsContainer.parentElement;
  mainContent.querySelectorAll('.inner-content').forEach(tc => tc.classList.remove('active'));
  const target = document.getElementById(targetId);
  if(target) target.classList.add('active');
}
