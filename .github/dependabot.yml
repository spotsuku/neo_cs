version: 2
updates:
  # Next.js v2 アプリ本体
  - package-ecosystem: npm
    directory: /neo-cs-v2
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-minor:
        dependency-type: production
        update-types: [minor, patch]
    labels: [dependencies, security]
    commit-message:
      prefix: "deps"
      include: scope

  # ルート (v1 凍結後の最低限)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies, security, root]

  # GitHub Actions 自体
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
