name: preview-deploy

# Vercel連携 (GitHub App) を有効にしている場合は本ワークフローは不要
# (Vercel 側が自動でプレビューを作る)。GitHub Actions 経由で
# 自前デプロイする場合のテンプレート。
#
# Secrets 必須:
#   VERCEL_TOKEN
#   VERCEL_ORG_ID
#   VERCEL_PROJECT_ID

on:
  pull_request:
    paths:
      - "neo-cs-v2/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  preview:
    name: vercel preview deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ secrets.VERCEL_TOKEN != '' }}
    defaults:
      run:
        working-directory: neo-cs-v2
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: neo-cs-v2/package-lock.json
      - run: npm ci
      - name: Install Vercel CLI
        run: npm i -g vercel@latest
      - name: Vercel pull (preview env)
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - name: Vercel build
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - name: Vercel deploy (prebuilt)
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - name: Comment PR with preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const url = "${{ steps.deploy.outputs.url }}";
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🔍 Preview: ${url}`
            });
